<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>정태일 · 글쓰는 여행자</title>
<meta name="description" content="정태일 포트폴리오 — 어렵고 복잡한 말을 쉽고 간단하게 구조화하는 비즈니스 라이팅 전문가. 언론홍보·대정부 커뮤니케이션·CEO 스피치라이팅·AI 업무혁신.">
<meta property="og:title" content="정태일 · 글쓰는 여행자">
<meta property="og:description" content="정태일 포트폴리오 — 어렵고 복잡한 말을 쉽고 간단하게 구조화하는 비즈니스 라이팅 전문가. 언론홍보·대정부 커뮤니케이션·CEO 스피치라이팅·AI 업무혁신.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://goodlife1102-ctrl.github.io/portfolio/images/profile.jpg"><meta property="og:url" content="https://goodlife1102-ctrl.github.io/portfolio/"><meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="images/logo.png">
<style>html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"><style id="main">
:root{
  --paper:#FAFAF8; --ink:#17191C; --muted:#5F636A; --faint:#999DA4;
  --rule:#E4E4DF; --card:#FFFFFF; --red:#C8372D; --red-soft:rgba(200,55,45,.08);
  --bar:#E9E9E4; --logo-filter:none;
  --serif:"Gowun Batang","Nanum Myeongjo","Apple SD Gothic Neo",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131416; --ink:#ECECE8; --muted:#A3A6AC; --faint:#72767D;
    --rule:#2A2C30; --card:#1A1B1E; --red:#E8625A; --red-soft:rgba(232,98,90,.12);
    --bar:#26282C; --logo-filter:invert(1); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131416; --ink:#ECECE8; --muted:#A3A6AC; --faint:#72767D;
  --rule:#2A2C30; --card:#1A1B1E; --red:#E8625A; --red-soft:rgba(232,98,90,.12);
  --bar:#26282C; --logo-filter:invert(1); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;padding-inline:24px;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
a{color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:1040px;margin:0 auto}
.narrow{max-width:680px}
h1,h2,h3{font-family:var(--serif);font-weight:700;text-wrap:balance;margin:0}
p{margin:0}
.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
a:focus-visible,button:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:2px}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);margin-inline:-24px;padding:12px 24px}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.nav .logo{height:34px;width:auto;filter:var(--logo-filter)}
.nav ul{display:flex;gap:22px;list-style:none;margin:0;padding:0;font-size:14px;flex-wrap:wrap}
.nav ul a{text-decoration:none;color:var(--muted)}
.nav ul a:hover{color:var(--ink)}

section{padding-block:72px;border-bottom:1px solid var(--rule)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:32px;flex-wrap:wrap}
.sec-head h2{font-size:28px}

/* hero */
.hero{padding-block:88px 64px}
.hero .eyebrow{margin-bottom:28px}
.hero h1{font-size:clamp(34px,6vw,64px);line-height:1.22;letter-spacing:-.01em;max-width:15em}
.hero h1 em{font-style:normal;box-shadow:inset 0 -2px 0 var(--red);background:linear-gradient(transparent 62%,var(--red-soft) 62%)}
.hero .roles{margin-top:24px;font-size:15px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:48px;border-top:1px solid var(--rule)}
.stat{padding:22px 20px 0 0}
.stat+.stat{padding-left:20px;border-left:1px solid var(--rule)}
.stat b{display:block;font-family:var(--serif);font-size:clamp(28px,4vw,40px);line-height:1.1}
.stat span{display:block;margin-top:8px;font-size:13px;color:var(--muted)}

/* about */
.about{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:48px;align-items:start}
.about .photo{border-radius:6px;overflow:hidden;border:1px solid var(--rule)}
.about .claim{font-family:var(--serif);font-size:clamp(22px,2.6vw,28px);line-height:1.5;margin-bottom:24px}
.about .claim mark{background:none;color:inherit;box-shadow:inset 0 -2px 0 var(--red)}
.about .intro{font-size:17px;color:var(--muted);margin-bottom:32px;line-height:1.9}
.pillars{border-top:1px solid var(--rule)}
.pillar{display:grid;grid-template-columns:88px 1fr;gap:16px;padding-block:18px;border-bottom:1px solid var(--rule)}
.pillar b{font-family:var(--serif);font-size:22px}
.pillar p{font-size:15px}
.pillar small{display:block;margin-top:4px;color:var(--faint);font-size:13px}
.skills{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 32px;margin-top:40px}
.skill .k{font-family:var(--mono);font-size:12px;color:var(--red)}
.skill b{display:block;font-size:16px;margin:4px 0 6px}
.skill p{font-size:14px;color:var(--muted)}
.principles{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.principles span{font-size:13px;border:1px solid var(--rule);border-radius:999px;padding:6px 12px;color:var(--muted)}
.principles b{color:var(--ink);font-weight:600;margin-right:4px}

/* career — horizontal */
.tl-scroll{overflow-x:auto;padding-bottom:8px}
.tl{position:relative;min-width:980px;height:500px}
.tl .lane-name{position:absolute;left:0;font-size:12px;color:var(--faint);font-family:var(--mono);letter-spacing:.06em}
.tl .axis{position:absolute;left:96px;right:0;top:466px;height:1px;background:var(--ink)}
.tl .tick{position:absolute;top:466px;width:1px;height:8px;background:var(--ink)}
.tl .tick span{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:12px;color:var(--muted)}
.tl .grid{position:absolute;top:0;bottom:34px;width:1px;background:var(--rule)}
.tl .bar{position:absolute;height:14px;border-radius:7px;background:var(--bar);border:1px solid var(--faint)}
.tl .bar.now{background:var(--red-soft);border-color:var(--red)}
.tl .bar.now::after{content:"";position:absolute;right:-12px;top:2px;border-left:8px solid var(--red);border-top:4px solid transparent;border-bottom:4px solid transparent}
.tl .tag{position:absolute;font-size:12.5px;line-height:1.45;width:180px}
.tl .tag.r{text-align:right}
.tl .tag b{display:block;font-size:13.5px}
.tl .tag i{font-style:normal;color:var(--muted);display:block}
.tl .tag .d{font-family:var(--mono);font-size:11px;color:var(--faint)}
.tl .ms{position:absolute;width:12px;height:12px;transform:rotate(45deg);background:var(--paper);border:1.5px solid var(--ink)}
.tl .ms.red{background:var(--red);border-color:var(--red)}
.tl .lead{position:absolute;width:1px;background:var(--rule)}
.tl .next{position:absolute;font-size:12px;color:var(--red);font-weight:600}
.tl-note{margin-top:14px;font-size:13px;color:var(--faint)}

/* work */
.work-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:40px 32px}
.work{display:flex;flex-direction:column;gap:14px;text-decoration:none}
.thumb{aspect-ratio:16/10;border-radius:6px;overflow:hidden;border:1px solid var(--rule);background:var(--card);max-width:100%;position:relative;padding:24px;display:flex;flex-direction:column;justify-content:flex-end}
.thumb.red{background:var(--red-soft);border-color:transparent}
.thumb .big{font-family:var(--serif);font-size:clamp(40px,6vw,64px);line-height:1;color:var(--red)}
.thumb .sub{margin-top:10px;font-size:14px;color:var(--muted)}
.thumb .names{position:absolute;top:22px;left:24px;right:24px;display:flex;flex-wrap:wrap;gap:6px}
.thumb .names span{font-size:12px;border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:3px 10px}
.thumb .qt{font-family:var(--serif);font-size:clamp(24px,3.4vw,34px);line-height:1.35}
.thumb .covers{display:flex;gap:12px;align-items:flex-end;justify-content:center;height:100%}
.thumb .covers img{height:78%;width:auto;box-shadow:0 6px 16px rgba(0,0,0,.18);border-radius:2px}
.thumb .covers img:nth-child(2){height:88%}
.work .meta{display:flex;gap:10px;font-size:13px;color:var(--faint)}
.work h3{font-size:22px;line-height:1.35}
.work p{font-size:15px;color:var(--muted)}
.work .go{font-size:14px;color:var(--red);font-weight:500}
.work .soon{font-size:13px;color:var(--faint)}

/* books */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:32px 24px}
.bk{text-decoration:none;display:flex;flex-direction:column;gap:10px}
.bk .cv{aspect-ratio:2/2.9;border-radius:3px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.14);background:var(--card);max-width:100%}
.bk .cv img{width:100%;height:100%;object-fit:cover}
.bk .cv.type{display:flex;flex-direction:column;justify-content:space-between;padding:16px;border:1px solid var(--rule);box-shadow:none}
.bk .cv.type b{font-family:var(--serif);font-size:19px;line-height:1.35}
.bk .cv.type span{font-size:12px;color:var(--faint)}
.bk .t{font-size:14px;font-weight:600;line-height:1.45}
.bk .m{font-size:12px;color:var(--faint);font-family:var(--mono)}
.bk .n{font-size:12.5px;color:var(--muted)}
.bk .kb{font-size:12px;color:var(--red)}
a.bk:hover .t{text-decoration:underline}

/* contact */
.contact-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.lec-note{margin:18px 0 0;font-size:13px;line-height:1.7;color:var(--muted)}
.lec-note .lec-links{white-space:nowrap;margin-left:6px}
.lec-note a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.lec-note a:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border:1px solid var(--ink);border-radius:999px;text-decoration:none;font-size:14px}
.btn.primary{background:var(--ink);color:var(--paper)}
.pending{font-size:13px;color:var(--faint);margin-top:14px}

footer{padding-block:40px 56px;display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;color:var(--faint);font-size:13px}
footer img{height:56px;width:auto;filter:var(--logo-filter);opacity:.85}

/* case */
.back{display:inline-block;margin-top:40px;font-size:14px;color:var(--muted);text-decoration:none}
.case-hero{padding-block:40px 56px}
.case-hero h1{font-size:clamp(32px,5vw,52px);line-height:1.25;margin-top:16px;max-width:16em}
.case-hero .lede{margin-top:22px;font-size:18px;color:var(--muted);max-width:36em}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:40px;padding-top:24px;border-top:1px solid var(--rule)}
.facts dt{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.facts dd{margin:6px 0 0;font-size:15px}
.case h2{font-size:24px;margin-bottom:18px}
.case .body{font-size:17px;max-width:36em}
.case .body p+p{margin-top:14px}
.flow{display:grid;grid-template-columns:1fr 32px 1fr 32px 1fr;align-items:stretch;margin-top:28px}
.flow .node{border:1px solid var(--rule);border-radius:6px;padding:18px;background:var(--card)}
.flow .node.hot{border-color:var(--red);background:var(--red-soft)}
.flow .node .who{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.06em}
.flow .node b{display:block;font-family:var(--serif);font-size:18px;margin:6px 0 10px}
.flow .node ul{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}
.flow .arr{display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:18px}
.quote{margin-top:32px;padding:28px 0;border-block:1px solid var(--rule)}
.quote p{font-family:var(--serif);font-size:clamp(24px,3.6vw,34px);line-height:1.4}
.quote small{display:block;margin-top:10px;color:var(--faint);font-size:13px}
.pi-wrap{overflow-x:auto;margin-top:8px}
.pi{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));min-width:820px;position:relative}
.pi::before{content:"";position:absolute;left:0;right:0;top:9px;height:1px;background:var(--rule)}
.pi .st{padding-right:20px}
.pi .dot{width:19px;height:19px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink);position:relative;z-index:1}
.pi .st:last-child .dot{background:var(--red);border-color:var(--red)}
.pi .when{margin-top:14px;font-family:var(--mono);font-size:12px;color:var(--faint)}
.pi b{display:block;font-family:var(--serif);font-size:20px;margin:4px 0 8px}
.pi p{font-size:14px;color:var(--muted)}
.pi .press{margin-top:10px;font-size:13px;border-left:2px solid var(--red);padding-left:10px}
.ba{display:grid;grid-template-columns:1fr 48px 1fr;gap:0;margin-top:32px;align-items:stretch}
.ba .col{border:1px solid var(--rule);border-radius:6px;padding:20px;background:var(--card)}
.ba .col.after{border-color:var(--red)}
.ba .col .label{margin-bottom:10px}
.ba .col.after .label{color:var(--red)}
.ba .lines span{display:block;height:7px;border-radius:4px;background:var(--bar);margin-bottom:7px}
.ba .chart{display:flex;align-items:flex-end;gap:6px;height:56px;margin-top:12px}
.ba .chart i{flex:1;background:var(--bar);border-radius:2px 2px 0 0}
.ba .head{font-family:var(--serif);font-size:22px;line-height:1.35;margin-bottom:10px}
.ba .col p{font-size:14px;color:var(--muted)}
.ba .mid{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--faint);text-align:center}
.gov{list-style:none;padding:0;margin:20px 0 0;display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--rule)}
.gov li{padding:16px 16px 16px 0;border-bottom:1px solid var(--rule);font-size:15px}
.gov li b{display:block;font-size:13px;color:var(--faint);font-weight:500;margin-bottom:2px}
.results{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule)}
.results div{padding:20px 16px 0 0}
.results div+div{padding-left:16px;border-left:1px solid var(--rule)}
.results b{display:block;font-family:var(--serif);font-size:34px;line-height:1.1}
.results span{font-size:13px;color:var(--muted)}
.works-list{list-style:none;padding:0;margin:12px 0 0}
.works-list li{display:flex;justify-content:space-between;gap:16px;padding-block:14px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.works-list li span{color:var(--faint);font-family:var(--mono);font-size:13px}
.next-cases{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.next-cases a{display:block;padding:18px;border:1px solid var(--rule);border-radius:6px;text-decoration:none;background:var(--card)}
.next-cases b{display:block;font-family:var(--serif);font-size:18px;margin-top:6px}

@media (max-width:760px){
  body{padding-inline:16px}
  .nav{margin-inline:-16px;padding-inline:16px}
  .nav ul{gap:14px}
  .about,.work-grid,.next-cases,.skills{grid-template-columns:1fr}
  .about .photo{max-width:260px}
  .stats,.results{grid-template-columns:1fr 1fr}
  .stat:nth-child(3){grid-column:1/-1;border-left:0;padding-left:0}
  .results div:nth-child(3){border-left:0;padding-left:0}
  .facts{grid-template-columns:1fr 1fr}
  .gov{grid-template-columns:1fr}
  .flow{grid-template-columns:1fr}
  .flow .arr{transform:rotate(90deg);height:32px}
  .ba{grid-template-columns:1fr}
  .ba .mid{padding:10px 0}
  section{padding-block:56px}
}

.hero .pre{font-size:17px;color:var(--muted);margin-bottom:10px}
.hero h1{font-size:clamp(30px,4.6vw,50px)!important;line-height:1.3!important;max-width:18em!important}
.skills{grid-template-columns:repeat(2,1fr);gap:24px;margin-top:48px}
.skill{border-top:2px solid var(--ink);padding-top:14px}
.skill b{font-size:17px}
.skill ul{margin:10px 0 0;padding-left:0;list-style:none;display:grid;gap:10px}
.skill li{font-size:14px;color:var(--muted);line-height:1.65}
.skill li strong{display:block;color:var(--ink);font-weight:600;font-size:14px}
.photo-thumb{padding:0!important;background:#f3f3ef}
.photo-thumb img{width:100%;height:100%;object-fit:contain}
.photo-thumb .cap{position:absolute;left:14px;bottom:12px;font-size:12px;background:var(--paper);padding:3px 10px;border-radius:999px;color:var(--muted)}
.shelf{grid-template-columns:repeat(6,minmax(0,1fr))!important;gap:18px 18px!important;max-width:760px}
.bk .cv{box-shadow:0 3px 10px rgba(0,0,0,.12)!important}
.bk .t{font-size:12.5px!important;font-weight:500!important}
.bk .m{font-size:11px!important}
.about .photo img{aspect-ratio:4/5;object-fit:cover}
.tl{height:300px!important}
.tl .tag{width:auto!important;white-space:nowrap;font-size:12px!important}
.tl .tag b{font-size:12.5px!important}
@media (max-width:760px){.shelf{grid-template-columns:repeat(3,minmax(0,1fr))!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* work competencies */
.work .thumb{aspect-ratio:auto;min-height:170px}
.work .thumb .names{position:static;margin-bottom:18px}
.work .k{font-family:var(--mono);font-size:12px;color:var(--red);letter-spacing:.04em}
.work h3{margin-top:-6px}
.pts{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.pts li{font-size:14.5px;color:var(--muted);line-height:1.7;padding-left:14px;border-left:2px solid var(--rule)}
.pts li strong{display:block;color:var(--ink);font-weight:600}
a.work:hover h3{text-decoration:underline}
/* edit mode */
.edit-fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:10px 18px;font:500 14px var(--sans);cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.edit-bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--rule);box-shadow:0 -6px 18px rgba(0,0,0,.08)}
.edit-msg{margin-right:auto;font-size:13px;color:var(--muted)}
.eb{background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:999px;padding:8px 16px;font:500 14px var(--sans);cursor:pointer}
.eb.ghost{background:transparent;color:var(--ink)}
.eb.sm{padding:4px 10px;font-size:12px}
.editing .is-ed{outline:1px dashed var(--faint);outline-offset:3px;border-radius:2px;cursor:text}
.editing .is-ed:focus{outline:2px solid var(--red)}
.editing body,.editing #app{padding-bottom:80px}
.tl-edit{margin-top:24px;padding:16px;border:1px dashed var(--faint);border-radius:6px;overflow-x:auto}
.tl-edit .tl-h{font-weight:600;font-size:14px;margin-bottom:8px}
.tl-edit .tl-h small{font-weight:400;color:var(--faint);margin-left:6px}
.tl-edit table{border-collapse:collapse;min-width:560px;margin-bottom:8px}
.tl-edit th{font-size:12px;color:var(--faint);text-align:left;font-weight:500;padding:2px 6px}
.tl-edit td{padding:2px 4px}
.tl-edit input{width:100%;min-width:70px;font:14px var(--sans);padding:5px 7px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);color:var(--ink)}

<div id="app"></div><script>
(function(){
  var RESET=':root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}';
  var SKEL='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>';
  var FONTS='<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">';
  var SELF=document.currentScript.textContent;
  var tpl=document.getElementById('page');
  var app=document.getElementById('app');
  var EDITABLE='h1,h2,h3,p,li,dt,dd,figcaption,.stat b,.stat span,.results b,.results span,.bk .t,.bk .m,.names span,.big,.sub,.pillar b,.k,.meta span,.go,.soon,.when,.press,.who,.node b,.btn,.label,.roles,footer div,.next-cases b';
  var TL=JSON.parse(tpl.content.getElementById('tldata').textContent);
  var editing=false, busy=false;

  function editables(root){
    var all=[].slice.call(root.querySelectorAll(EDITABLE)), set=new Set(all);
    return all.filter(function(el){
      for(var p=el.parentElement;p&&p!==root;p=p.parentElement){ if(set.has(p)) return false; }
      return !el.closest('#tl') && !el.closest('#tl-m') && !el.closest('.edit-ui');
    });
  }
  function ym(v){ if(!v) return NaN; v=String(v).trim(); if(v==='현재'){ var d=new Date(); return d.getFullYear()+d.getMonth()/12; } var p=v.split('.'); return parseInt(p[0],10)+((parseInt(p[1]||'1',10)||1)-1)/12; }

  // ---------- timeline ----------
  function drawTL(){
    var el=app.querySelector('#tl'); if(!el) return;
    var Y0=1999, Y1=2027.2, L=64;
    function x(y){ return L+(y-Y0)/(Y1-Y0)*(el.clientWidth-L-70); }
    function add(cls,css,html){ var d=document.createElement('div'); d.className=cls; Object.assign(d.style,css); if(html!=null) d.innerHTML=html; el.appendChild(d); return d; }
    function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }
    el.innerHTML='';
    var lanes=[{n:'경력',y:34},{n:'저서',y:152}];
    lanes.forEach(function(l){ add('lane-name',{top:(l.y-3)+'px'},l.n); });
    [1999,2005,2010,2015,2020,2026].forEach(function(y){ var lb=y===2026?'2026 (현재)':String(y); add('grid',{left:x(y)+'px',bottom:'30px'}); add('tick',{left:x(y)+'px',top:'200px'},'<span>'+lb+'</span>'); });
    add('axis',{left:L+'px',top:'200px'});
    var spans=TL.spans.slice().sort(function(a,b){return ym(a.s)-ym(b.s);});
    spans.forEach(function(s,i){
      var a=ym(s.s), b=ym(s.e), now=String(s.e).trim()==='현재', top=lanes[0].y; if(isNaN(a)||isNaN(b)) return;
      add('bar'+(now?' now':''),{left:x(a)+'px',width:Math.max(6,x(b)-x(a)-3)+'px',top:top+'px'});
      var row=i%2, ty=top+22+(row?40:0);
      if(row) add('lead',{left:(x(a)+4)+'px',top:(top+16)+'px',height:'40px'});
      var tg=add('tag co-tag'+(s.id===CUR?' on':''),{left:x(a)+'px',top:ty+'px'},'<b>'+(s.logo?'<img class="ci solo" src="'+s.logo+'" alt="'+esc(s.t)+'" title="'+esc(s.t)+'">':esc(s.t))+'</b><i>'+esc(s.r)+'</i>'); if(s.id){ tg.dataset.co=s.id; tg.setAttribute('role','button'); tg.tabIndex=0; tg.setAttribute('aria-label',s.t+' 업무 보기'); }
      if(now) add('next',{left:(x(b)+14)+'px',top:(top-2)+'px'},'진행 중');
    });
    var books=TL.books.slice().sort(function(a,b){return ym(a.y)-ym(b.y);});
    books.forEach(function(bk,i){
      var yy=ym(bk.y), top=lanes[1].y, last=i===books.length-1; if(isNaN(yy)) return;
      var cv=bk.c?'<img src="'+esc(bk.c)+'" alt="'+esc(bk.t)+' 표지">':'<span class="ms-in"></span>';
      var c=add('bk-cv',{left:(x(yy)-13)+'px',top:(top-14)+'px'},bk.u?'<a href="'+esc(bk.u)+'" target="_blank" rel="noopener" title="'+esc(bk.t)+'" aria-label="'+esc(bk.t)+' 교보문고">'+cv+'</a>':cv);
      return;
      var row=last?0:1, ty=top+30+row*20;
      if(row) add('lead',{left:x(yy)+'px',top:(top+24)+'px',height:(row*20+6)+'px'});
      var nearEnd=true;
      add('tag bk-tag'+(nearEnd?' r':''),nearEnd?{right:(el.clientWidth-x(yy)-6)+'px',top:ty+'px'}:{left:(x(yy)-6)+'px',top:ty+'px'},bk.u?'<a href="'+esc(bk.u)+'" target="_blank" rel="noopener"><b>'+esc(bk.t)+'</b></a>':'<b>'+esc(bk.t)+'</b>');
    });
  }

  function drawTLm(){
    var el=app.querySelector('#tl-m'); if(!el) return;
    function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }
    var spans=TL.spans.slice().sort(function(a,b){return ym(b.s)-ym(a.s);});
    var h='<ol class="tlm-list">';
    spans.forEach(function(s){
      var now=String(s.e).trim()==='현재';
      h+='<li class="tlm-item co-tag'+(s.id===CUR?' on':'')+(now?' now':'')+'" data-co="'+esc(s.id||'')+'" role="button" tabindex="0">'
        +'<span class="tlm-ci">'+(s.logo?'<img src="'+esc(s.logo)+'" alt="">':'')+'</span>'
        +'<span class="tlm-txt"><b>'+esc(s.t)+'</b><i>'+esc(s.s)+' – '+esc(s.e)+' · '+esc(s.r)+'</i></span><span class="tlm-arr" aria-hidden="true">›</span></li>';
    });
    h+='</ol><p class="tlm-lab">저서</p><div class="tlm-books">';
    TL.books.slice().sort(function(a,b){return ym(a.y)-ym(b.y);}).forEach(function(b){
      h+='<a href="'+esc(b.u||'#')+'" target="_blank" rel="noopener" title="'+esc(b.t)+'">'+(b.c?'<img src="'+esc(b.c)+'" alt="'+esc(b.t)+' 표지">':'')+'<span>'+esc(String(b.y).slice(0,4))+'</span></a>';
    });
    el.innerHTML=h+'</div>';
  }

  var CUR='kepco';
  function showCo(id){
    CUR=id;
    app.querySelectorAll('#co-panel .co').forEach(function(c){ c.hidden=(c.dataset.co!==id); });
    app.querySelectorAll('.co-tag').forEach(function(t){ t.classList.toggle('on',t.dataset.co===id); });
  }
  app.addEventListener('click',function(e){ var t=e.target.closest('.co-tag'); if(t&&t.dataset.co){ showCo(t.dataset.co); if(t.classList.contains('tlm-item')){ var pn=app.querySelector('#co-panel'); if(pn) pn.scrollIntoView({behavior:'smooth',block:'start'}); } } });
  app.addEventListener('keydown',function(e){ var t=e.target.closest&&e.target.closest('.co-tag'); if(t&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); showCo(t.dataset.co); } });

  // ---------- routing ----------
  function route(){
    var home=app.querySelector('#home'); if(!home) return;
    var h=(location.hash||'').replace('#',''), cs=h?app.querySelector('#case-'+CSS.escape(h)):null;
    home.hidden=!!cs;
    app.querySelectorAll('.case-page').forEach(function(m){ m.hidden=(m!==cs); });
    if(cs) window.scrollTo(0,0);
    else { drawTL(); drawTLm(); showCo(CUR); if(h){ var t=app.querySelector('#'+CSS.escape(h)); if(t) t.scrollIntoView(); } }
  }

  function render(){
    app.innerHTML='';
    var frag=tpl.content.cloneNode(true);
    var d=frag.getElementById('tldata'); if(d) d.remove();
    app.appendChild(frag);
    route();
  }
  window.addEventListener('hashchange',route);
  window.addEventListener('resize',drawTL);
  render();

})();
</script>
