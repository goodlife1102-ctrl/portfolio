<body>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"><style id="main">
:root{
  --paper:#FAFAF8; --ink:#17191C; --muted:#5F636A; --faint:#999DA4;
  --rule:#E4E4DF; --card:#FFFFFF; --red:#C8372D; --red-soft:rgba(200,55,45,.08);
  --bar:#E9E9E4; --logo-filter:none;
  --serif:"Gowun Batang","Nanum Myeongjo","Apple SD Gothic Neo",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131416; --ink:#ECECE8; --muted:#A3A6AC; --faint:#72767D;
    --rule:#2A2C30; --card:#1A1B1E; --red:#E8625A; --red-soft:rgba(232,98,90,.12);
    --bar:#26282C; --logo-filter:invert(1); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131416; --ink:#ECECE8; --muted:#A3A6AC; --faint:#72767D;
  --rule:#2A2C30; --card:#1A1B1E; --red:#E8625A; --red-soft:rgba(232,98,90,.12);
  --bar:#26282C; --logo-filter:invert(1); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;padding-inline:24px;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
a{color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:1040px;margin:0 auto}
.narrow{max-width:680px}
h1,h2,h3{font-family:var(--serif);font-weight:700;text-wrap:balance;margin:0}
p{margin:0}
.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
a:focus-visible,button:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:2px}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);margin-inline:-24px;padding:12px 24px}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.nav .logo{height:34px;width:auto;filter:var(--logo-filter)}
.nav ul{display:flex;gap:22px;list-style:none;margin:0;padding:0;font-size:14px;flex-wrap:wrap}
.nav ul a{text-decoration:none;color:var(--muted)}
.nav ul a:hover{color:var(--ink)}

section{padding-block:72px;border-bottom:1px solid var(--rule)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:32px;flex-wrap:wrap}
.sec-head h2{font-size:28px}

/* hero */
.hero{padding-block:88px 64px}
.hero .eyebrow{margin-bottom:28px}
.hero h1{font-size:clamp(34px,6vw,64px);line-height:1.22;letter-spacing:-.01em;max-width:15em}
.hero h1 em{font-style:normal;box-shadow:inset 0 -2px 0 var(--red);background:linear-gradient(transparent 62%,var(--red-soft) 62%)}
.hero .roles{margin-top:24px;font-size:15px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:48px;border-top:1px solid var(--rule)}
.stat{padding:22px 20px 0 0}
.stat+.stat{padding-left:20px;border-left:1px solid var(--rule)}
.stat b{display:block;font-family:var(--serif);font-size:clamp(28px,4vw,40px);line-height:1.1}
.stat span{display:block;margin-top:8px;font-size:13px;color:var(--muted)}

/* about */
.about{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:48px;align-items:start}
.about .photo{border-radius:6px;overflow:hidden;border:1px solid var(--rule)}
.about .claim{font-family:var(--serif);font-size:clamp(22px,2.6vw,28px);line-height:1.5;margin-bottom:24px}
.about .claim mark{background:none;color:inherit;box-shadow:inset 0 -2px 0 var(--red)}
.about .intro{font-size:17px;color:var(--muted);margin-bottom:32px;line-height:1.9}
.pillars{border-top:1px solid var(--rule)}
.pillar{display:grid;grid-template-columns:88px 1fr;gap:16px;padding-block:18px;border-bottom:1px solid var(--rule)}
.pillar b{font-family:var(--serif);font-size:22px}
.pillar p{font-size:15px}
.pillar small{display:block;margin-top:4px;color:var(--faint);font-size:13px}
.skills{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 32px;margin-top:40px}
.skill .k{font-family:var(--mono);font-size:12px;color:var(--red)}
.skill b{display:block;font-size:16px;margin:4px 0 6px}
.skill p{font-size:14px;color:var(--muted)}
.principles{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.principles span{font-size:13px;border:1px solid var(--rule);border-radius:999px;padding:6px 12px;color:var(--muted)}
.principles b{color:var(--ink);font-weight:600;margin-right:4px}

/* career — horizontal */
.tl-scroll{overflow-x:auto;padding-bottom:8px}
.tl{position:relative;min-width:980px;height:500px}
.tl .lane-name{position:absolute;left:0;font-size:12px;color:var(--faint);font-family:var(--mono);letter-spacing:.06em}
.tl .axis{position:absolute;left:96px;right:0;top:466px;height:1px;background:var(--ink)}
.tl .tick{position:absolute;top:466px;width:1px;height:8px;background:var(--ink)}
.tl .tick span{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:12px;color:var(--muted)}
.tl .grid{position:absolute;top:0;bottom:34px;width:1px;background:var(--rule)}
.tl .bar{position:absolute;height:14px;border-radius:7px;background:var(--bar);border:1px solid var(--faint)}
.tl .bar.now{background:var(--red-soft);border-color:var(--red)}
.tl .bar.now::after{content:"";position:absolute;right:-12px;top:2px;border-left:8px solid var(--red);border-top:4px solid transparent;border-bottom:4px solid transparent}
.tl .tag{position:absolute;font-size:12.5px;line-height:1.45;width:180px}
.tl .tag.r{text-align:right}
.tl .tag b{display:block;font-size:13.5px}
.tl .tag i{font-style:normal;color:var(--muted);display:block}
.tl .tag .d{font-family:var(--mono);font-size:11px;color:var(--faint)}
.tl .ms{position:absolute;width:12px;height:12px;transform:rotate(45deg);background:var(--paper);border:1.5px solid var(--ink)}
.tl .ms.red{background:var(--red);border-color:var(--red)}
.tl .lead{position:absolute;width:1px;background:var(--rule)}
.tl .next{position:absolute;font-size:12px;color:var(--red);font-weight:600}
.tl-note{margin-top:14px;font-size:13px;color:var(--faint)}

/* work */
.work-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:40px 32px}
.work{display:flex;flex-direction:column;gap:14px;text-decoration:none}
.thumb{aspect-ratio:16/10;border-radius:6px;overflow:hidden;border:1px solid var(--rule);background:var(--card);max-width:100%;position:relative;padding:24px;display:flex;flex-direction:column;justify-content:flex-end}
.thumb.red{background:var(--red-soft);border-color:transparent}
.thumb .big{font-family:var(--serif);font-size:clamp(40px,6vw,64px);line-height:1;color:var(--red)}
.thumb .sub{margin-top:10px;font-size:14px;color:var(--muted)}
.thumb .names{position:absolute;top:22px;left:24px;right:24px;display:flex;flex-wrap:wrap;gap:6px}
.thumb .names span{font-size:12px;border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:3px 10px}
.thumb .qt{font-family:var(--serif);font-size:clamp(24px,3.4vw,34px);line-height:1.35}
.thumb .covers{display:flex;gap:12px;align-items:flex-end;justify-content:center;height:100%}
.thumb .covers img{height:78%;width:auto;box-shadow:0 6px 16px rgba(0,0,0,.18);border-radius:2px}
.thumb .covers img:nth-child(2){height:88%}
.work .meta{display:flex;gap:10px;font-size:13px;color:var(--faint)}
.work h3{font-size:22px;line-height:1.35}
.work p{font-size:15px;color:var(--muted)}
.work .go{font-size:14px;color:var(--red);font-weight:500}
.work .soon{font-size:13px;color:var(--faint)}

/* books */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:32px 24px}
.bk{text-decoration:none;display:flex;flex-direction:column;gap:10px}
.bk .cv{aspect-ratio:2/2.9;border-radius:3px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.14);background:var(--card);max-width:100%}
.bk .cv img{width:100%;height:100%;object-fit:cover}
.bk .cv.type{display:flex;flex-direction:column;justify-content:space-between;padding:16px;border:1px solid var(--rule);box-shadow:none}

.cap{display:flex;gap:4px;margin-top:24px}

.cap .seg b{display:block;font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.04em;margin-bottom:6px}
.cap .seg p{font-size:var(--fs-small);line-height:1.6}
.cap .c,.cap .p{background:var(--bar)}
.cap .a{background:var(--red);color:#fff}
.appcase{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:32px;align-items:start;margin-top:24px}
.shot{display:block;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.08);text-decoration:none}
.shot .bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--rule)}
.shot .bar i{width:9px;height:9px;border-radius:50%;background:var(--faint);opacity:.5}
.shot .bar em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:8px}
.shot img{width:100%;height:auto}
.app-sum{font-family:var(--serif);font-size:19px;line-height:1.5;margin-bottom:16px}
.app-info .btn{margin-top:18px}
.case-page .more{border-bottom:0}
@media (max-width:760px){.flow4{grid-template-columns:1fr}.fan-row,.twin,.appcase,.results.r3{grid-template-columns:1fr}.fan-lines{display:none}.fan-core{margin-bottom:14px}.cap{flex-direction:column}.cap .seg{flex:auto!important}.tier.b,.tier.c{width:100%}}

/* v9 career CI + detail */
.co[hidden]{display:none!important}
.tl .tag.co-tag{cursor:pointer;border-radius:4px}
.tl .tag.co-tag:hover b{text-decoration:underline}
.tl .tag.co-tag.on{box-shadow:inset 0 -2px 0 var(--red)}
.tl .tag .ci{display:inline-block;height:15px;width:auto;vertical-align:-3px;margin-right:6px}
.co-panel{margin-top:8px;border:1px solid var(--rule);border-radius:6px;background:var(--card);padding:20px 22px}
.co{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:24px;align-items:start}
.co-head{display:flex;gap:12px;align-items:center}
.co-ci{height:28px;width:auto;max-width:96px;object-fit:contain;flex:none}
.co-ci.none{display:none}
.co-name{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.35}
.co-meta{font-family:var(--mono);font-size:var(--fs-label);color:var(--faint);margin-top:2px}
.co-pts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.co-pts li{font-size:14px;color:var(--muted);line-height:1.6;padding-left:12px;border-left:2px solid var(--rule)}
.co-pts li strong{color:var(--ink);font-weight:600;margin-right:6px}
.co-go{display:inline-block;margin-top:10px;font-size:var(--fs-small);color:var(--red);text-decoration:none}
.awards{margin-top:24px;display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:24px}
.awards ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
.awards li{font-size:14px;color:var(--muted)}
.awards li b{font-family:var(--mono);font-size:var(--fs-label);color:var(--ink);margin-right:8px;font-weight:500}
:root[data-theme="dark"] .co-ci,:root[data-theme="dark"] .tl .tag .ci{background:#fff;border-radius:3px;padding:1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .co-ci,:root:not([data-theme="light"]) .tl .tag .ci{background:#fff;border-radius:3px;padding:1px}}
@media (max-width:760px){.co,.awards{grid-template-columns:1fr;gap:12px}.awards ul{grid-template-columns:1fr}}

/* v10 brunch magazines */
.mags{display:grid;grid-template-columns:minmax(0,160px) 1fr 1fr;gap:14px;align-items:stretch;margin-top:36px;max-width:760px}
.mags .label{align-self:center}
.mag{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid var(--rule);border-radius:6px;background:var(--card);text-decoration:none}
.mag:hover{border-color:var(--red)}
.mag-k{font-size:var(--fs-label);color:var(--faint)}
.mag b{font-family:var(--serif);font-size:16px;color:var(--ink)}
.mag-go{font-size:var(--fs-small);color:var(--red);margin-top:auto}
@media (max-width:760px){.mags{grid-template-columns:1fr}}

/* v11 */
:root{--blue:#1F4E9C;--blue-soft:rgba(31,78,156,.08)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--blue:#7EA6E8;--blue-soft:rgba(126,166,232,.12)}}
:root[data-theme="dark"]{--blue:#7EA6E8;--blue-soft:rgba(126,166,232,.12)}
.work-grid>.work .thumb.blue{background:var(--blue-soft)!important;border-color:transparent!important}
.work-grid>.work .thumb.blue .ttl{color:var(--blue)}
.work-grid>.work .thumb.red{background:var(--red-soft)!important;border-color:transparent!important}
.tl .bk-tag a{text-decoration:none;color:inherit}
.tl .bk-tag a:hover b{text-decoration:underline;color:var(--red)}
.mags{grid-template-columns:repeat(3,1fr)!important;max-width:none!important;margin-top:0!important}

/* v12 book covers on timeline */
.tl{height:292px!important}
.tl .bk-cv{position:absolute;width:26px;z-index:2}
.tl .bk-cv img{width:26px;height:37px;object-fit:cover;border-radius:2px;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .15s}
.tl .bk-cv a:hover img{transform:translateY(-3px) scale(1.08)}

/* v13 */
.tl{height:234px!important}
.tl .lane-name{font-family:var(--sans)!important;font-size:14px!important;font-weight:600;color:var(--ink)!important;letter-spacing:0!important}
.tl{height:262px!important}

/* v15 */
.tl .tag .ci.solo{height:19px;vertical-align:-4px;margin-right:0}
/* v14 media + mobile */
.media-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.mcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit}
.mthumb{position:relative;display:block;aspect-ratio:16/9;border-radius:6px;overflow:hidden;border:1px solid var(--rule);background:#000}
.mthumb img{width:100%;height:100%;object-fit:cover;transition:transform .2s}
.mthumb.folin{background:var(--card)}
.mthumb.folin img{object-fit:cover;object-position:center 25%}
.mcard:hover .mthumb img{transform:scale(1.04)}
.play{position:absolute;left:50%;top:50%;width:44px;height:30px;margin:-15px 0 0 -22px;border-radius:8px;background:rgba(200,0,0,.9)}
.play::after{content:"";position:absolute;left:18px;top:9px;border-left:11px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}
.msrc{font-family:var(--mono);font-size:var(--fs-label);color:var(--faint)}
.mcard b{font-size:14.5px;line-height:1.5;color:var(--ink)}
.mcard:hover b{text-decoration:underline}
.tl-m{display:none}

        <h3>대정부·대국회 커뮤니케이션과 정책 모니터링</h3>
        <ul class="pts">
          <li><strong>전기요금 조정 설득 논리 개발</strong>한전의 숙원과제인 요금 조정을 위해 원가 구조와 조정 필요성을 분석하고, 대중·언론·국회가 한 번에 이해할 표현으로 국회를 설득</li>
          <li><strong>국정감사 대응</strong>산업통상자원부 산하 피감기관에서 해마다 CEO 모두발언과 예상 질의·답변을 정리하고 설명자료를 준비</li>
          <li><strong>대통령·국회 대상 서신</strong>대통령 앞 CEO 경영서신을 여러 차례 작성해 경영 상황과&nbsp;<div>정책 지원 필요성을 전달하고, 국무총리·장관·국회의원 대상 경영서신 작성</div></li>
          <li><strong>정책·법령 추적</strong>전력망 특별법, 해상풍력법, 전기요금 체계 개편처럼&nbsp;<div>회사 손익을 좌우하는 법안을 발의부터 시행령 입법예고까지 모니터링</div></li>
        </ul>

        <ul class="pts">
          <li><strong>담론 형성</strong>단순 배포를 넘어 에너지 산업의 흐름을 짚는 기획기사를 꾸준히 발굴해&nbsp;<div>핵심 의제를 선점, 해당 분야 독보적 지위 확보</div></li>
          <li><strong>프레임 전환</strong>연료비와 판매가격의 관계를 “두부(전기)가 콩(연료)보다 싸다”는 비유로 풀어 우호적 여론과 정책 수용성을 확보</li>
          <li><strong>출입기자 네트워크</strong>산업부 출입기자단 57개 매체 154명과 현안이 없을 때도<br>먼저 찾아가는 우호적 관계를 넓게 유지</li>
          <li><strong>위기 대응</strong>고성·속초 산불 같은 국가적 재난 상황에서 C.A.P.(위로·조치·재발방지) 원칙으로 입장문과 사과문을 즉시 설계해 부정 여론을 조기 진화</li>
        </ul>

      <a class="work" href="#speech">

        <h3>최고경영자 메시지 전담과 의제 설정</h3>
        <ul class="pts">
          <li><strong>리더의 언어 설계</strong>포스코퓨처엠·삼양그룹·한국전력에서 이취임사, 신년사, 주주총회 인사말,<br>대외 강연자료까지 11개 유형의 CEO 말씀자료 전담</li>
          <li><strong>CEO 칼럼과 인터뷰</strong>정책 현안을 다룬 CEO 명의 칼럼을 다수 집필하고, 인터뷰 준비와 진행을 맡아 민감한 질문에도 사실과 근거로 일관되게 답하도록 지원</li>
          <li><strong>CEO 브랜드(PI) 구축</strong>사장이 취임할 때마다 인간적 매력과 서사, 경영 현안을 엮은 스토리텔링 전략을 세우고 실행 (예: 정치인 출신 CEO를 ‘에너지 소통 전문가’로)</li>
        </ul>

        <h3>AI 도구를 직접 만들어 홍보 업무를 바꾸다</h3>
        <ul class="pts">
          <li><strong>AI 라이팅 모델 ‘파워라이터’</strong>한전 내부 데이터를 수차례 학습시킨 맞춤형 글쓰기 모델을 기획해<br>홍보실 초안 작성 시간을 30% 이상 단축</li>
          <li><strong>뉴스 분석 시스템</strong>새벽부터 서너 시간 걸리던 뉴스 스크랩을 바이브 코딩으로 만든 앱으로 자동화해 기사 수집, 위험도 판단, 논조 분석까지 한 화면에서 1분 만에 확인</li>
          <li><strong>글쓰기 실행 도구</strong>스피치라이터의 글쓰기 방법들을 앱에 모두 담아<br>누구라도 5분 만에 완성도 높은 초안을 작성할 수 있도록 사내 AI 시스템 도입</li>
        </ul>

    <div class="body"><p>단순히 AI 사용법을 배우는 매뉴얼 소개가 아닙니다.</p><div>회사에서 AI로 글을 쓰고 일하는 방식을 통째로 바꾸는 실무형 강의입니다.</div><p></p><p>한국전력공사 CEO 스피치 전담과 보도자료 검수 데스크,&nbsp;</p><div>삼양홀딩스 명예회장 자서전 및 사사, 포스코퓨처엠 기업문화·CEO 스피치를 수행했습니다.</div><p></p></div>
    <div class="quote"><p>“직장인 글쓰기의 본질을 정확히 이야기하면서<br>AI 도구를 활용하는 구체적 방법도 자세히 알려준다”</p><small>강원국 (전 청와대 연설비서관, 《대통령의 글쓰기》 작가) · 책 《업무시간을 반으로 줄이는 챗GPT 글쓰기》 추천사</small></div>

  <section class="case">
    <p class="label step">Why This Training · 왜 이 강의인가</p>
    <h2>직장인의 글쓰기는 개인의 취향이나 선택이 아닙니다.&nbsp;<div>기업의 성과와 효율의 문제입니다.</div></h2>
    <div class="twin">
      <div class="node"><p>이메일과 보고서가 산만하고 애매하면 결재가 하루 늦어집니다.&nbsp;</p><div>대표의 인터뷰 한 줄이 어긋나면 기사 제목이 바뀝니다.&nbsp;</div><div>사과문 첫 문장이 잘못되면 수습에 몇 배의 시간이 듭니다.&nbsp;</div><div><br></div><div>그런데 조직은 글쓰기를 개인의 재능으로 착각합니다.&nbsp;</div><div>잘 쓰는 사람에게 일을 계속 몰아주고, 못 쓰는 사람은 계속 다시 씁니다.&nbsp;</div><div>AI 글쓰기로 그 비효율을 줄여야 합니다.</div><p></p></div>
      <div class="node"><p>직장인의 글쓰기는 천부적 재능이 아니라 공식으로 배우는 기술입니다.</p><div><br></div><div>보고서에는 검증된 구조가 있고, 사과문에는 순서와 원칙이 있고,&nbsp;</div><div>리더의 메시지에는 목적과 유형이 있습니다.&nbsp;</div><div><br></div><div>저는 그 공식을 20년간 현장에서 만들어 썼습니다. 이 강의에서 저는 평범한 AI 이론이 아니라, 지금 당장 써먹을 수 있는 직장인의 AI 글쓰기를 알려드립니다.</div><p></p></div>
    </div>
    <p class="lec-sub">놀랍게도 대부분의 직장인들은 글쓰기를 제대로 배워본 적이 없습니다.&nbsp;</p><div>이 강의에서 얻으실 수 있는 3개 핵심 역량</div><p></p>
    <div class="lec-courses">
      <div class="node"><span class="who">01</span><b>직장인 글쓰기의 절대불변 원칙</b><p>PREP, 골든서클, 로그라인과 두괄식·피드백</p></div>

  var RESET=':root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}';
  var SKEL='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>';
  var FONTS='<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">';
  var SELF=document.currentScript.textContent;
  var tpl=document.getElementById('page');
  var app=document.getElementById('app');
  var EDITABLE='h1,h2,h3,p,li,dt,dd,td,th,.lec-who span,figcaption,.stat b,.stat span,.results b,.results span,.bk .t,.bk .m,.names span,.big,.sub,.pillar b,.k,.meta span,.go,.soon,.when,.press,.who,.node b,.btn,.label,.roles,footer div,.next-cases b';
  var TL=JSON.parse(tpl.content.getElementById('tldata').textContent);
  var editing=false, busy=false;

  function editables(root){
    var all=[].slice.call(root.querySelectorAll(EDITABLE)), set=new Set(all);
    return all.filter(function(el){
      for(var p=el.parentElement;p&&p!==root;p=p.parentElement){ if(set.has(p)) return false; }
      return !el.closest('#tl') && !el.closest('#tl-m') && !el.closest('.edit-ui');
    });
  }
  function ym(v){ if(!v) return NaN; v=String(v).trim(); if(v==='현재'){ var d=new Date(); return d.getFullYear()+d.getMonth()/12; } var p=v.split('.'); return parseInt(p[0],10)+((parseInt(p[1]||'1',10)||1)-1)/12; }

  // ---------- timeline ----------
  function drawTL(){
    var el=app.querySelector('#tl'); if(!el) return;
    var Y0=1999, Y1=2027.2, L=64;
    function x(y){ return L+(y-Y0)/(Y1-Y0)*(el.clientWidth-L-70); }
    function add(cls,css,html){ var d=document.createElement('div'); d.className=cls; Object.assign(d.style,css); if(html!=null) d.innerHTML=html; el.appendChild(d); return d; }
    function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }
    el.innerHTML='';
    var lanes=[{n:'경력',y:34},{n:'저서',y:152}];
    lanes.forEach(function(l){ add('lane-name',{top:(l.y-3)+'px'},l.n); });
    [1999,2005,2010,2015,2020,2026].forEach(function(y){ var lb=y===2026?'2026 (현재)':String(y); add('grid',{left:x(y)+'px',bottom:'30px'}); add('tick',{left:x(y)+'px',top:'200px'},'<span>'+lb+'</span>'); });
    add('axis',{left:L+'px',top:'200px'});
    var spans=TL.spans.slice().sort(function(a,b){return ym(a.s)-ym(b.s);});
    spans.forEach(function(s,i){
      var a=ym(s.s), b=ym(s.e), now=String(s.e).trim()==='현재', top=lanes[0].y; if(isNaN(a)||isNaN(b)) return;
      add('bar'+(now?' now':''),{left:x(a)+'px',width:Math.max(6,x(b)-x(a)-3)+'px',top:top+'px'});
      var row=i%2, ty=top+22+(row?40:0);
      if(row) add('lead',{left:(x(a)+4)+'px',top:(top+16)+'px',height:'40px'});
      var tg=add('tag co-tag'+(s.id===CUR?' on':''),{left:x(a)+'px',top:ty+'px'},'<b>'+(s.logo?'<img class="ci solo" src="'+s.logo+'" alt="'+esc(s.t)+'" title="'+esc(s.t)+'">':esc(s.t))+'</b><i>'+esc(s.r)+'</i>'); if(s.id){ tg.dataset.co=s.id; tg.setAttribute('role','button'); tg.tabIndex=0; tg.setAttribute('aria-label',s.t+' 업무 보기'); }
      if(now) add('next',{left:(x(b)+14)+'px',top:(top-2)+'px'},'진행 중');
    });
    var books=TL.books.slice().sort(function(a,b){return ym(a.y)-ym(b.y);});
    books.forEach(function(bk,i){
      var yy=ym(bk.y), top=lanes[1].y, last=i===books.length-1; if(isNaN(yy)) return;
      var cv=bk.c?'<img src="'+esc(bk.c)+'" alt="'+esc(bk.t)+' 표지">':'<span class="ms-in"></span>';
      var c=add('bk-cv',{left:(x(yy)-13)+'px',top:(top-14)+'px'},bk.u?'<a href="'+esc(bk.u)+'" target="_blank" rel="noopener" title="'+esc(bk.t)+'" aria-label="'+esc(bk.t)+' 교보문고">'+cv+'</a>':cv);
      return;
      var row=last?0:1, ty=top+30+row*20;
      if(row) add('lead',{left:x(yy)+'px',top:(top+24)+'px',height:(row*20+6)+'px'});
      var nearEnd=true;
      add('tag bk-tag'+(nearEnd?' r':''),nearEnd?{right:(el.clientWidth-x(yy)-6)+'px',top:ty+'px'}:{left:(x(yy)-6)+'px',top:ty+'px'},bk.u?'<a href="'+esc(bk.u)+'" target="_blank" rel="noopener"><b>'+esc(bk.t)+'</b></a>':'<b>'+esc(bk.t)+'</b>');
    });
  }

  function drawTLm(){
    var el=app.querySelector('#tl-m'); if(!el) return;
    function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }
    var spans=TL.spans.slice().sort(function(a,b){return ym(b.s)-ym(a.s);});
    var h='<ol class="tlm-list">';
    spans.forEach(function(s){
      var now=String(s.e).trim()==='현재';
      h+='<li class="tlm-item co-tag'+(s.id===CUR?' on':'')+(now?' now':'')+'" data-co="'+esc(s.id||'')+'" role="button" tabindex="0">'
        +'<span class="tlm-ci">'+(s.logo?'<img src="'+esc(s.logo)+'" alt="">':'')+'</span>'
        +'<span class="tlm-txt"><b>'+esc(s.t)+'</b><i>'+esc(s.s)+' – '+esc(s.e)+' · '+esc(s.r)+'</i></span><span class="tlm-arr" aria-hidden="true">›</span></li>';
    });
    h+='</ol><p class="tlm-lab">저서</p><div class="tlm-books">';
    TL.books.slice().sort(function(a,b){return ym(a.y)-ym(b.y);}).forEach(function(b){
      h+='<a href="'+esc(b.u||'#')+'" target="_blank" rel="noopener" title="'+esc(b.t)+'">'+(b.c?'<img src="'+esc(b.c)+'" alt="'+esc(b.t)+' 표지">':'')+'<span>'+esc(String(b.y).slice(0,4))+'</span></a>';
    });
    el.innerHTML=h+'</div>';
  }

  // ---------- contact helpers ----------
  var DL=null, inViewer=!!(window.claude&&typeof window.claude.use==='function');
  if(inViewer){ window.claude.use('downloads').then(function(d){ DL=d; }).catch(function(){}); }

  function copyMail(el){
    var addr=el.getAttribute('data-copy'), done=function(){ el.classList.add('copied'); clearTimeout(el._t); el._t=setTimeout(function(){ el.classList.remove('copied'); },2000); };
    function fallback(){ var r=document.createRange(); r.selectNodeContents(el.querySelector('.addr')||el); var s=window.getSelection(); s.removeAllRanges(); s.addRange(r); var ok=false; try{ ok=document.execCommand('copy'); }catch(_){} if(ok) done(); }
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(addr).then(done,fallback); else fallback();
  }
  app.addEventListener('click',function(e){
    if(editing) return;
    var cm=e.target.closest('.copy-mail'); if(cm){ e.preventDefault(); copyMail(cm); return; }
    var a=e.target.closest('a.lec-pdf'); if(!a||!DL) return;
    e.preventDefault(); var href=a.getAttribute('href');
    fetch(href).then(function(r){ if(!r.ok) throw 0; return r.blob(); })
    .then(function(b){ return DL.save({filename:a.getAttribute('download')||'lecture.pdf',data:b}); })
    .catch(function(err){ if(err&&err.code==='declined') return; window.open(href,'_blank'); });
  });

  document.addEventListener('click',function(e){ var a=e.target.closest&&e.target.closest('a[href^="#lec-"]'); if(!a||document.documentElement.classList.contains('editing')) return; var t=document.getElementById(a.getAttribute('href').slice(1)); if(t){ e.preventDefault(); t.scrollIntoView({behavior:'smooth',block:'start'}); } });
  var CUR='kepco';
  function showCo(id){
    CUR=id;
    app.querySelectorAll('#co-panel .co').forEach(function(c){ c.hidden=(c.dataset.co!==id); });
    app.querySelectorAll('.co-tag').forEach(function(t){ t.classList.toggle('on',t.dataset.co===id); });
  }
  app.addEventListener('click',function(e){ var t=e.target.closest('.co-tag'); if(t&&t.dataset.co){ showCo(t.dataset.co); if(t.classList.contains('tlm-item')){ var pn=app.querySelector('#co-panel'); if(pn) pn.scrollIntoView({behavior:'smooth',block:'start'}); } } });
  app.addEventListener('keydown',function(e){ var t=e.target.closest&&e.target.closest('.co-tag'); if(t&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); showCo(t.dataset.co); } });

  // ---------- routing ----------
  function route(){
    var home=app.querySelector('#home'); if(!home) return;
    var h=(NAVH!=null?NAVH:(location.hash||'')).replace('#',''), cs=h?app.querySelector('#case-'+CSS.escape(h)):null;
    home.hidden=!!cs;
    app.querySelectorAll('.case-page').forEach(function(m){ m.hidden=(m!==cs); });
    if(cs) window.scrollTo(0,0);
    else { drawTL(); drawTLm(); showCo(CUR); if(h){ var t=app.querySelector('#'+CSS.escape(h)); if(t) t.scrollIntoView(); } }
  }

  function render(){
    app.innerHTML='';
    var frag=tpl.content.cloneNode(true);
    var d=frag.getElementById('tldata'); if(d) d.remove();
    app.appendChild(frag);
    route();
  }
  var NAVH=null;
  window.addEventListener('hashchange',function(){ NAVH=null; });
  document.addEventListener('click',function(e){
    if(document.documentElement.classList.contains('editing')) return;
    var a=e.target.closest&&e.target.closest('a[href]'); if(!a) return;
    var href=a.getAttribute('href')||'';
    if(href.charAt(0)==='#'&&href.length>1&&href.indexOf('#lec-')!==0){
      e.preventDefault(); NAVH=href; try{ history.pushState(null,'',href); }catch(_){}
      route(); if(!app.querySelector('#case-'+CSS.escape(href.slice(1)))){ var t=app.querySelector(href.replace(/^#/,'#')); } return;
    }
    if(a.target==='_blank'&&/^https?:/.test(href)&&!a.classList.contains('lec-pdf')){
      e.preventDefault(); var w=null; try{ w=window.open(href,'_blank'); if(w) w.opener=null; }catch(_){}
      if(!w){ try{ window.top.location.href=href; }catch(_){ try{ location.href=href; }catch(__){} } }
    }
  });
  window.addEventListener('popstate',function(){ NAVH=null; route(); });
  window.addEventListener('hashchange',route);
  window.addEventListener('resize',drawTL);
  render();

})();
</script>
</body>
</html>
